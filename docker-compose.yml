services:
  postgresql:
    image: postgres
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - saved_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  backend:
    container_name: hungy
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile

    # working_dir: /app

    # volumes:
    #   - ./backend:/app

    ports: 
      - "3001:3001"

    environment:
      - DATABASE_URL=postgres://postgres:password@postgresql:5432/postgres?sslmode=disable
    
    depends_on:
      postgresql:
        condition: service_healthy
    
volumes:
  saved_data: